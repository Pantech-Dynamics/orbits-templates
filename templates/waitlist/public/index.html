<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Something new is coming</title>
    <meta name="description" content="Join the waitlist and be first to know when we launch." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Something new is coming" />
    <meta property="og:description" content="Join the waitlist and be first to know when we launch." />
    <meta property="og:image" content="{{origin}}/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Something new is on its way. Join the waitlist." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/orbit.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="ground">
    <main class="page">
      <p class="brand reveal"><span class="tile solid">N</span>Your product</p>

      <section class="panel card reveal" style="--delay: 40ms">
        <div class="panel-head">
          <span>Waitlist</span>
          <span class="badge accent">Coming soon</span>
        </div>
        <div class="body">
          <h1 class="title">Something new is on its way.</h1>
          <p class="lede">Leave your email and we'll tell you the moment it's ready. One email, no spam.</p>

          <form method="post" action="/join" novalidate>
            <label class="sr" for="email">Email address</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            <input class="trap" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <button class="btn btn-primary" type="submit">Join the waitlist</button>
          </form>
          <p class="status" role="status" aria-live="polite"></p>
        </div>
        <p class="count"><strong class="mono" data-count>{{count}}</strong> on the list so far.</p>
      </section>

      <ul class="facts">
        <li class="panel reveal" style="--delay: 80ms"><span class="label">When</span>One email, on launch day</li>
        <li class="panel reveal" style="--delay: 120ms"><span class="label">What</span>Your address, nothing else</li>
        <li class="panel reveal" style="--delay: 160ms"><span class="label">After</span>Leave whenever you like</li>
      </ul>
    </main>

    <script>
      const form = document.querySelector("form");
      const status = document.querySelector(".status");
      const count = document.querySelector("[data-count]");
      const params = new URLSearchParams(location.search);
      const say = (message, tone) => {
        status.textContent = message;
        status.dataset.tone = tone;
      };
      if (params.has("joined")) say("You're on the list. We'll email you when it's ready.", "good");
      if (params.has("error")) say("That doesn't look like an email address.", "bad");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        button.disabled = true;
        status.textContent = "";
        try {
          const res = await fetch("/join", {
            method: "POST",
            headers: { accept: "application/json", "content-type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form))),
          });
          const { ok, message, total } = await res.json();
          say(message, ok ? "good" : "bad");
          if (ok) form.reset();
          if (typeof total === "number" && String(total) !== count.textContent) {
            count.textContent = total;
            if (matchMedia("(prefers-reduced-motion: no-preference)").matches) {
              count.animate([{ transform: "translateY(40%)", opacity: 0 }, { transform: "none", opacity: 1 }], {
                duration: 250,
                easing: "cubic-bezier(0.23, 1, 0.32, 1)",
              });
            }
          }
        } catch {
          say("That didn't go through. Try again.", "bad");
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
